[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ms"
version = "0.2.0"
description = "MS -- LLM Policy Runtime: provider 독립 텔레메트리 · 상태 · 맥락/프롬프트/provider 정책 · WALP 중재자"
readme = "README.md"
requires-python = ">=3.10"
# action 계약 · 명세 · 술어 한 벌 · 실행기(BD-108 · BD-111). 필수 의존이다 -- 커밋 sha 로 고정한다(guard · health 와 같은 sha)
dependencies = ["action-contract @ git+https://github.com/cogito5170/action@3995fdb3ba487f31d841d3e11b710e64f0d523db"]

[project.optional-dependencies]
# 선택 의존 -- MS 는 Sensor 를 import 하지 않는다(계약은 sense() 출력의 데이터 꼴). 깔면 sense() 를 바로 부를 수 있을 뿐이다
sensor = ["llmsensor @ git+https://github.com/cogito5170/Sensor"]

[project.scripts]
ms = "ms.cli:main"

[tool.setuptools]
packages = ["ms", "ms.providers"]

[tool.setuptools.package-data]
ms = ["examples/*.json", "examples/*.jsonl"]
