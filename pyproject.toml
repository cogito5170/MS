[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ms"
version = "0.2.0"
description = "MS -- LLM Policy Runtime: provider 독립 텔레메트리 · 상태 · 맥락/프롬프트/provider 정책 · WALP 중재자"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ms = "ms.cli:main"

[tool.setuptools]
packages = ["ms", "ms.providers"]

[tool.setuptools.package-data]
ms = ["examples/*.json", "examples/*.jsonl"]
